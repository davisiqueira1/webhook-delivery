include classpath("application.conf")

node-address {
    protocol = http
    host = localhost
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

queues {
    webhook-delivery {
        defaultVisibilityTimeout = 60 seconds
        deadLettersQueue {
            name = "webhook-delivery-dlq"
            maxReceiveCount = 5
        }
    }
    webhook-delivery-dlq { }
}